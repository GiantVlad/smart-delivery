name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - deploy

jobs:
  php-tests:
    name: PHPUnit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    container:
      image: gaintvlad/php84-grpc-rrunner:v2025.1.6
    strategy:
      fail-fast: false
      matrix:
        suite: [Unit, Integration, Feature]
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views,testing} storage/logs
          chmod -R ug+rwX bootstrap/cache storage

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-sockets

      - name: Ensure Unit tests directory exists
        run: mkdir -p tests/Unit

      - name: Run PHPUnit suite
        run: php artisan test --testsuite=${{ matrix.suite }} --log-junit junit-${{ matrix.suite }}.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: src/junit-${{ matrix.suite }}.xml

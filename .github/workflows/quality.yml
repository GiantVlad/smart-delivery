name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - deploy

jobs:
  php-quality:
    name: PHP Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,views,testing} storage/logs
          chmod -R ug+rwX bootstrap/cache storage

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-sockets

      - name: Run Pint
        run: ./vendor/bin/pint --test

  frontend-quality:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (if config exists)
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ]; then
            npx eslint resources/js --ext .js,.vue
          else
            echo "No ESLint config found, skipping lint."
          fi

      - name: Build frontend
        run: npm run build
